<body>
<header><div class="wide topbar"><div class="brand" data-action="home" role="button" tabindex="0" aria-label="回首頁"><div class="logo" aria-hidden="true">🤖</div><div><div class="brand-title">機器人學科練習系統</div><div class="brand-sub">115 學年度 · 工科技藝競賽</div></div></div><nav><button class="nav-btn" data-action="home">首頁</button><button class="nav-btn" data-action="wrong-home">錯題本</button><button class="nav-btn" data-action="history">歷史成績</button></nav></div></header>
<main id="app"><div class="wide" style="padding:40px 20px">正在載入題庫…</div></main>
<footer><div class="wide">題庫來源：使用者提供《115學年度學生工業類技藝競賽－機器人職種學科題庫》｜563 題｜資料與圖片以來源 PDF 為準。本網站為練習工具，並非競賽主辦單位官方網站。紀錄保存在本裝置瀏覽器。</div></footer>
<script src="questions.js"></script>
<script>
(()=>{'use strict';
const DATA=window.ROBOT_QUIZ_DATA;
const app=document.getElementById('app');
const CHAPTER_ICONS={general:'🧠',mechanics:'⚙️',sensors:'📡',motors:'🔩',software:'💻'};
const PREF_KEY='robot115-prefs-v1',PROGRESS_KEY='robot115-progress-v1',HISTORY_KEY='robot115-history-v1',SESSION_KEY='robot115-active-v1';
const read=(k,fallback)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??fallback}catch{return fallback}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn('Unable to save to browser storage',e)}};
const prefs=Object.assign({shuffleQuestions:false,shuffleChoices:false,practiceCount:'all',examMinutes:'50'},read(PREF_KEY,{}));
let progress=read(PROGRESS_KEY,{}),history=read(HISTORY_KEY,[]);
let state={view:'home',mode:null,chapter:'',sessionQuestions:[],index:0,answers:{},optionOrders:{},submitted:false,examEndAt:0,result:null,reviewMode:false};
let clock=null;
const byId=new Map(DATA?.questions?.map(q=>[q.id,q])||[]);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const intFmt=n=>new Intl.NumberFormat('zh-TW').format(n);
const $=s=>document.querySelector(s);
const chapterName=id=>DATA.chapters.find(c=>c.id===id)?.title||'五章混合';
const hasAnswer=(q)=>Object.prototype.hasOwnProperty.call(state.answers,q.id);
const activeQuestion=()=>state.sessionQuestions[state.index];
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const digits='ABCD';
const oldSession=()=>read(SESSION_KEY,null);
function persistSession(){if(!state.sessionQuestions.length||state.submitted)return;write(SESSION_KEY,{mode:state.mode,chapter:state.chapter,ids:state.sessionQuestions.map(q=>q.id),index:state.index,answers:state.answers,optionOrders:state.optionOrders,examEndAt:state.examEndAt})}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch{}}
function setView(view){state.view=view;window.scrollTo({top:0,behavior:'instant'});render()}
function stopClock(){if(clock){clearInterval(clock);clock=null}}
function setNav(){document.querySelectorAll('.nav-btn').forEach(e=>e.classList.toggle('active',e.dataset.action===(state.view==='home'?'home':state.view==='history'?'history':state.view==='wrong'?'wrong-home':'none')))}
function noteAttempt(q,selected){const entry=progress[q.id]||{attempts:0,correct:0,wrong:0};entry.attempts++;if(selected===q.answer)entry.correct++;else entry.wrong++;entry.lastCorrect=selected===q.answer;entry.lastAt=Date.now();progress[q.id]=entry}
function saveProgress(){write(PROGRESS_KEY,progress)}
function wrongQuestions(){return DATA.questions.filter(q=>progress[q.id]?.lastCorrect===false)}
function chapterStats(key){const qs=DATA.questions.filter(q=>q.chapter===key);const answered=qs.filter(q=>progress[q.id]?.attempts>0).length;return{answered,percent:Math.round(answered/qs.length*100)}}
function render(){setNav();if(!DATA||DATA.questions.length!==563){app.innerHTML='<div class="wide empty">題庫未正確載入，請確認 questions.js 與 index.html 放在同一資料夾。</div>';return}
 if(state.view==='home')renderHome();else if(state.view==='history')renderHistory();else if(state.view==='wrong')renderWrongHome();else if(state.view==='results')renderResults();else renderStudy();setNav()}
function renderHome(){const continued=oldSession();app.innerHTML=`<div class="wide">
<section class="hero"><div><div class="eyebrow">ROBOTICS · SKILLS COMPETITION</div><h1>工科技藝競賽<br>機器人職種學科題庫</h1><p>從五大章節逐題練習，選答案立即判斷正誤；包含 PDF 原題圖片、選項隨機、鍵盤操作與 50 題模擬考。</p></div><div class="hero-stats"><div class="hero-stat"><b>563</b><span>題庫總題數</span></div><div class="hero-stat"><b>05</b><span>學科章節</span></div></div></section>
${continued?`<div class="alert"><b>📌 你有尚未完成的${continued.mode==='exam'?'模擬考':'章節練習'}。</b> <button class="button small primary" data-action="resume">繼續上次進度</button> <button class="button small" data-action="discard">放棄進度</button></div>`:''}
<div class="section-heading"><div><h2>選擇練習章節</h2><p>點選章節即可開始練習，作答紀錄會自動儲存在本機。</p></div></div>
<div class="chapter-grid">${DATA.chapters.map(ch=>{const s=chapterStats(ch.id);return `<button class="chapter-card" data-action="start-chapter" data-chapter="${ch.id}"><div class="ch-head"><div class="ch-icon">${CHAPTER_ICONS[ch.id]}</div><div class="ch-count">${ch.count} 題</div></div><h3>${esc(ch.title)}</h3><div class="chapter-meta"><span>已練習 ${s.answered} 題</span><span>${s.percent}%</span></div><div class="progress-line"><div class="progress-fill" style="width:${s.percent}%"></div></div><div class="go">開始本章練習 →</div></button>`}).join('')}</div>
<div class="controls"><h3>⚡ 練習設定</h3><div class="settings-row"><label class="switch-wrap"><input type="checkbox" data-pref="shuffleQuestions" ${prefs.shuffleQuestions?'checked':''}>題目順序隨機</label><label class="switch-wrap"><input type="checkbox" data-pref="shuffleChoices" ${prefs.shuffleChoices?'checked':''}>選項 A～D 隨機排序（純文字題）</label><label class="select-wrap">每次練習 <select data-pref="practiceCount"><option value="all" ${prefs.practiceCount==='all'?'selected':''}>全章題目</option><option value="20" ${prefs.practiceCount==='20'?'selected':''}>20 題</option><option value="50" ${prefs.practiceCount==='50'?'selected':''}>50 題</option></select></label></div><p class="muted small" style="margin:12px 0 0">快速鍵：1／2／3／4 作答，→ 鍵或滑鼠右鍵下一題；可用題號導覽切換。一般文字題可隨機選項；有原圖的題目維持 PDF A～D 順序，避免圖片標示錯位。</p></div>
<div class="exam-card"><div><h3>📝 50 題模擬考試</h3><p>五章混合隨機抽 50 題，滿分 100 分；答對 +2 分、答錯 −1 分、未答 0 分，交卷後公布答案。</p><label class="select-wrap" style="margin-top:13px">作答時間 <select data-pref="examMinutes"><option value="0" ${prefs.examMinutes==='0'?'selected':''}>不限時</option><option value="30" ${prefs.examMinutes==='30'?'selected':''}>30 分鐘</option><option value="50" ${prefs.examMinutes==='50'?'selected':''}>50 分鐘</option><option value="60" ${prefs.examMinutes==='60'?'selected':''}>60 分鐘</option></select></label></div><button class="button primary" data-action="start-exam">開始模擬考試 →</button></div>
</div>`}
function createSession(mode,chapter,questions){stopClock();if(!questions.length){alert('目前沒有可練習的題目。');return}state={view:'study',mode,chapter,sessionQuestions:questions,index:0,answers:{},optionOrders:{},submitted:false,examEndAt:mode==='exam'&&+prefs.examMinutes>0?Date.now()+ +prefs.examMinutes*60000:0,result:null,reviewMode:false};for(const q of questions)state.optionOrders[q.id]=prefs.shuffleChoices&&!q.figure&&!q.visualOptions?shuffle([0,1,2,3]):[0,1,2,3];persistSession();render();startClock()}
function startChapter(id){let qs=DATA.questions.filter(q=>q.chapter===id);if(prefs.shuffleQuestions)qs=shuffle(qs);if(prefs.practiceCount!=='all')qs=qs.slice(0,+prefs.practiceCount);createSession('practice',id,qs)}
function startExam(){const qs=shuffle(DATA.questions).slice(0,50);createSession('exam','all',qs)}
function startWrong(){const qs=wrongQuestions();if(!qs.length){setView('wrong');return}createSession('practice','wrong',prefs.shuffleQuestions?shuffle(qs):qs)}
function resume(){const saved=oldSession();if(!saved)return;const qs=saved.ids.map(id=>byId.get(id)).filter(Boolean);if(!qs.length){clearSession();return}state={view:'study',mode:saved.mode,chapter:saved.chapter,sessionQuestions:qs,index:Math.min(saved.index,qs.length-1),answers:saved.answers||{},optionOrders:saved.optionOrders||{},submitted:false,examEndAt:saved.examEndAt||0,result:null,reviewMode:false};for(const q of qs)if(!state.optionOrders[q.id])state.optionOrders[q.id]=[0,1,2,3];render();startClock()}
function startClock(){stopClock();if(state.mode!=='exam'||!state.examEndAt||state.submitted)return;const tick=()=>{const rem=state.examEndAt-Date.now();const el=$('#timer');if(rem<=0){stopClock();submitExam(true);return}if(el){el.textContent='⏱ '+formatTime(rem);el.classList.toggle('urgent',rem<300000)}};clock=setInterval(tick,1000);tick()}
function formatTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function chooseOption(index){if(state.view!=='study'||state.submitted)return;const q=activeQuestion();if(!q)return;const selected=state.optionOrders[q.id][index];if(state.mode==='practice'&&hasAnswer(q))return;state.answers[q.id]=selected;if(state.mode==='practice'){noteAttempt(q,selected);saveProgress()}persistSession();renderStudy({preserveScroll:true})}
function gotoQuestion(idx){if(state.view!=='study'||idx<0||idx>=state.sessionQuestions.length)return;state.index=idx;persistSession();renderStudy();window.scrollTo({top:75,behavior:'instant'})}
function nextQuestion(){if(state.view==='study'&&state.index<state.sessionQuestions.length-1)gotoQuestion(state.index+1)}
function prevQuestion(){if(state.view==='study'&&state.index>0)gotoQuestion(state.index-1)}
function statusFor(q){if(!hasAnswer(q))return'';if(state.mode==='exam'&&!state.submitted)return'answered';return state.answers[q.id]===q.answer?'good':'bad'}
function counts(){let done=0,correct=0,wrong=0;for(const q of state.sessionQuestions){if(hasAnswer(q)){done++;if(state.answers[q.id]===q.answer)correct++;else wrong++}}return{done,correct,wrong,blank:state.sessionQuestions.length-done}}
function renderStudy(opt={}){const q=activeQuestion();if(!q){setView('home');return}const c=counts(),isExam=state.mode==='exam',checked=hasAnswer(q),reveal=!isExam||state.submitted,selected=state.answers[q.id],orders=state.optionOrders[q.id]||[0,1,2,3];const savedY=window.scrollY;
app.innerHTML=`<div class="wide"><div class="study-top"><div><div class="breadcrumb">首頁 / ${esc(state.chapter==='wrong'?'錯題本':chapterName(state.chapter))} / ${isExam?'模擬考試':'章節練習'}</div><h1>${isExam?'50 題模擬考試':esc(state.chapter==='wrong'?'錯題複習':chapterName(state.chapter))}</h1></div><div class="chip-row"><span class="chip">第 ${state.index+1} / ${state.sessionQuestions.length} 題</span><span class="chip">已答 ${c.done} 題</span>${isExam&&state.examEndAt?`<span class="chip timer" id="timer">⏱ ${formatTime(state.examEndAt-Date.now())}</span>`:''}</div></div>
<div class="study-grid"><section class="question-panel"><div class="question-head"><span class="q-num">第 ${q.no} 題 · ${esc(chapterName(q.chapter))}</span><span class="muted small">來源 PDF 第 ${q.page} 頁</span></div><div class="question-body"><p class="question-text">${esc(q.question)}</p>${q.figure?`<div class="figure-box"><p class="figure-caption">📷 本題原始圖像（依 PDF 擷取）</p><img src="${esc(q.figure)}" alt="第 ${q.no} 題的原始題目圖像" loading="eager"></div>`:''}
${q.visualOptions?'<p class="muted small" style="margin:2px 0 12px">🖼 本題的 A～D 是圖片選項，請依上方圖片中的 A、B、C、D 圖示作答。</p>':''}<div class="answer-list">${orders.map((original,idx)=>{const text=q.options[original],isCorrect=original===q.answer,isSelected=selected===original,cls=checked&&reveal?(isCorrect?'correct':isSelected?'wrong':''):checked&&isSelected?'answer-picked':'';return `<button class="answer-btn ${cls} ${checked&&!isExam?'locked':''}" data-action="answer" data-choice="${idx}" ${checked&&!isExam?'disabled':''} aria-label="選項 ${digits[idx]}：${esc(text||'請參考原題圖像')}"><span class="letter">${digits[idx]}</span><span class="answer-text">${esc(text&&!/^[。．. ]*$/.test(text)?text:'請參考上方圖片中的對應選項')}</span><span aria-hidden="true">${checked&&reveal&&isCorrect?'✓':checked&&reveal&&isSelected?'✕':''}</span></button>`}).join('')}</div>
${checked&&reveal?`<div class="answer-note ${selected===q.answer?'correct':'wrong'}">${selected===q.answer?'✓ 回答正確！':'✕ 回答錯誤。'} 正確答案：${digits[orders.indexOf(q.answer)]}（本次畫面選項）</div>`:''}
<details class="ref-details"><summary>📄 與原始 PDF 題目對照（答案已遮蔽）</summary><img src="${esc(q.source)}" class="source-image" alt="PDF 第 ${q.page} 頁第 ${q.no} 題原題版面" loading="lazy"><div class="source-note">此圖由原始 PDF 截取，題目前的答案代號已遮蔽；如發現內容差異，請以原始 PDF 為準。</div></details></div>
<div class="question-bottom"><div class="chip-row"><button class="button" data-action="prev" ${state.index===0?'disabled':''}>← 上一題</button><button class="button primary" data-action="next" ${state.index===state.sessionQuestions.length-1?'disabled':''}>下一題 →</button></div><span class="shortcut">鍵盤 1～4 選答案，→ 下一題；滑鼠右鍵亦可下一題</span></div></section>
<aside class="side-panel"><div class="side-title"><h3>題號導覽</h3><button class="button small ghost" data-action="home">離開</button></div><div class="legend"><span><i class="green"></i>正確</span><span><i class="red"></i>錯誤</span><span><i class="${isExam?'blue':'gray'}"></i>${isExam?'已答未評':'未作答'}</span></div><div class="number-grid">${state.sessionQuestions.map((item,i)=>`<button class="num-btn ${statusFor(item)} ${i===state.index?'active':''}" data-action="goto" data-index="${i}" aria-label="前往第 ${i+1} 題" aria-current="${i===state.index?'step':'false'}">${i+1}</button>`).join('')}</div><div class="side-summary"><div class="summary-row"><span>已作答</span><b>${c.done} / ${state.sessionQuestions.length}</b></div>${!isExam||state.submitted?`<div class="summary-row"><span>答對</span><b style="color:var(--green)">${c.correct}</b></div><div class="summary-row"><span>答錯</span><b style="color:var(--red)">${c.wrong}</b></div>`:''}<div class="progress-line" style="margin-top:12px"><div class="progress-fill" style="width:${Math.round(c.done/state.sessionQuestions.length*100)}%"></div></div></div>${isExam?`<button class="button primary" style="width:100%;margin-top:13px" data-action="submit-exam">交卷並計分</button>`:`<button class="button ghost" style="width:100%;margin-top:13px" data-action="finish-practice">結束練習</button>`}</aside></div></div>`;
if(opt.preserveScroll)window.scrollTo(0,savedY);if(state.mode==='exam'&&state.examEndAt){const e=$('#timer');if(e)e.textContent='⏱ '+formatTime(state.examEndAt-Date.now())}}
function submitExam(forced=false){if(state.mode!=='exam'||state.submitted)return;const c=counts();if(!forced&&c.blank>0&&!window.confirm(`還有 ${c.blank} 題未作答。確定要交卷嗎？`))return;stopClock();state.submitted=true;const score=c.correct*2-c.wrong;const when=new Date();state.result={score,...c,date:when.toLocaleString('zh-TW',{hour12:false}),iso:when.toISOString(),chapterTotals:DATA.chapters.map(ch=>({title:ch.title,correct:state.sessionQuestions.filter(q=>q.chapter===ch.id&&hasAnswer(q)&&state.answers[q.id]===q.answer).length,total:state.sessionQuestions.filter(q=>q.chapter===ch.id).length}))};
for(const q of state.sessionQuestions)if(hasAnswer(q))noteAttempt(q,state.answers[q.id]);saveProgress();history.unshift({...state.result,id:Date.now()});history=history.slice(0,100);write(HISTORY_KEY,history);clearSession();state.view='results';render()}
function finishPractice(){stopClock();clearSession();state.sessionQuestions=[];setView('home')}
function renderResults(){const r=state.result;if(!r){setView('home');return}app.innerHTML=`<div class="wide simple-page"><div class="breadcrumb">首頁 / 模擬考試 / 成績報告</div><h1>📋 模擬考試結果</h1><div class="result-hero"><div class="muted small">本次測驗總分（基準滿分 100 分）</div><div class="score-badge">${r.score} <span class="muted" style="font-size:1.2rem">分</span></div><div class="muted small">計分：答對 ${r.correct} × 2 − 答錯 ${r.wrong} × 1 = ${r.score} 分；未答 ${r.blank} 題不計分</div><div class="chip-row" style="margin-top:14px"><button class="button primary" data-action="review-exam">逐題檢討</button><button class="button" data-action="start-exam">再考一次</button><button class="button" data-action="home">返回首頁</button></div></div><div class="review-grid"><div class="review-stat positive"><div class="label">答對</div><div class="value">${r.correct}</div></div><div class="review-stat negative"><div class="label">答錯</div><div class="value">${r.wrong}</div></div><div class="review-stat"><div class="label">未作答</div><div class="value">${r.blank}</div></div></div><div class="simple-card"><h3>五章答對統計</h3><div class="table-scroll"><table class="history-table"><thead><tr><th>章節</th><th>本次抽題</th><th>答對</th></tr></thead><tbody>${r.chapterTotals.map(a=>`<tr><td>${esc(a.title)}</td><td>${a.total}</td><td>${a.correct}</td></tr>`).join('')}</tbody></table></div></div><div class="simple-card"><h3>答題清單</h3><div class="exam-review-list">${state.sessionQuestions.map((q,i)=>{const a=state.answers[q.id],ok=a===q.answer,t=hasAnswer(q)?ok?'good':'bad':'blank';return `<button class="exam-review-item ${t}" data-action="review-item" data-index="${i}"><span>第 ${i+1} 題</span><span class="rname">${esc(q.question)}</span><span>${t==='good'?'✓ 正確':t==='bad'?'✕ 錯誤':'未作答'}</span></button>`}).join('')}</div></div></div>`}
function reviewExam(idx=0){state.view='study';state.submitted=true;state.index=idx;renderStudy();window.scrollTo({top:75,behavior:'instant'})}
function renderHistory(){app.innerHTML=`<div class="wide simple-page"><div class="breadcrumb">首頁 / 歷史成績</div><h1>📊 歷史模擬考成績</h1><p class="muted">只記錄目前這台裝置與這個瀏覽器的考試結果，不會傳送到老師端。</p><div class="simple-card">${history.length?`<div class="chip-row" style="justify-content:end;margin-bottom:15px"><button class="button small" data-action="export-csv">匯出 CSV</button></div><div class="table-scroll"><table class="history-table"><thead><tr><th>考試時間</th><th>得分</th><th>答對</th><th>答錯</th><th>未答</th></tr></thead><tbody>${history.map(r=>`<tr><td>${esc(r.date)}</td><td><b>${r.score}</b></td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.blank}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">📝</div>尚無模擬考成績。<br>完成一次 50 題測驗後會在這裡留下紀錄。</div>`}</div></div>`}
function renderWrongHome(){const qs=wrongQuestions();app.innerHTML=`<div class="wide simple-page"><div class="breadcrumb">首頁 / 錯題本</div><h1>📕 錯題本</h1><p class="muted">只收錄目前瀏覽器中最近一次作答錯誤的題目；重新練習答對即可從清單移除。</p><div class="simple-card">${qs.length?`<div class="chip-row" style="justify-content:space-between;align-items:center"><b>共有 ${qs.length} 題需加強</b><button class="button primary" data-action="start-wrong">開始錯題複習 →</button></div><div class="exam-review-list">${qs.map(q=>`<div class="exam-review-item bad"><span>${esc(chapterName(q.chapter))} 第 ${q.no} 題</span><span class="rname">${esc(q.question)}</span></div>`).join('')}</div>`:`<div class="empty"><div class="big">🌱</div>目前沒有待複習錯題。<br>從五個章節開始練習吧！<p><button class="button primary" data-action="home">選擇章節</button></p></div>`}</div></div>`}
function exportCsv(){const data=[['日期','分數','答對','答錯','未作答'],...history.map(r=>[r.date,r.score,r.correct,r.wrong,r.blank])];const csv='\ufeff'+data.map(x=>x.map(s=>'"'+String(s).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='機器人學科模擬考成績.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
switch(action){case'home':stopClock();setView('home');break;case'history':stopClock();setView('history');break;case'wrong-home':stopClock();setView('wrong');break;case'start-chapter':startChapter(el.dataset.chapter);break;case'start-exam':startExam();break;case'start-wrong':startWrong();break;case'answer':chooseOption(+el.dataset.choice);break;case'prev':prevQuestion();break;case'next':nextQuestion();break;case'goto':gotoQuestion(+el.dataset.index);break;case'submit-exam':submitExam();break;case'finish-practice':finishPractice();break;case'resume':resume();break;case'discard':clearSession();render();break;case'export-csv':exportCsv();break;case'review-exam':reviewExam();break;case'review-item':reviewExam(+el.dataset.index);break;}});
document.querySelector('header').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;stopClock();setView(action==='wrong-home'?'wrong':action==='history'?'history':'home')});
app.addEventListener('change',e=>{const el=e.target.closest('[data-pref]');if(!el)return;const k=el.dataset.pref;if(!Object.prototype.hasOwnProperty.call(prefs,k))return;prefs[k]=el.type==='checkbox'?el.checked:el.value;write(PREF_KEY,prefs)});
document.addEventListener('keydown',e=>{if(state.view!=='study'||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;if(e.target?.closest?.('input,textarea,select,[contenteditable]'))return;const key=e.key;if(/^[1-4]$/.test(key)||/^Numpad[1-4]$/.test(e.code)){e.preventDefault();chooseOption(Number(key.match(/\d/)?.[0]||e.code.slice(-1))-1)}else if(key==='ArrowRight'){e.preventDefault();nextQuestion()}else if(key==='ArrowLeft'){e.preventDefault();prevQuestion()}});
document.addEventListener('contextmenu',e=>{if(state.view==='study'&&!e.target.closest('input,textarea,select')){e.preventDefault();nextQuestion()}});
window.addEventListener('beforeunload',()=>{if(state.view==='study'&&!state.submitted)persistSession()});
render();
})();
</script>
</body>
</html>
